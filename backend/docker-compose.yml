services:
  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: backend
    container_name: email_campaign_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      - APP_NAME=EmailCampaignManager
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=email_campaigns
      - DB_USERNAME=campaign_user
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=database
      # nginx (frontend container) proxies /api/ from Docker's private address range
      - TRUSTED_PROXIES=172.16.0.0/12
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/campaigns"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - campaign_network

  queue:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: backend
    container_name: email_campaign_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=30"]
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      - APP_NAME=EmailCampaignManager
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=email_campaigns
      - DB_USERNAME=campaign_user
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=database
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - campaign_network

  scheduler:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: backend
    container_name: email_campaign_scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      - APP_NAME=EmailCampaignManager
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=email_campaigns
      - DB_USERNAME=campaign_user
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=database
    depends_on:
      app:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - campaign_network

  frontend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: frontend
    container_name: email_campaign_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - campaign_network

  mysql:
    image: mysql:8.0
    container_name: email_campaign_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: email_campaigns
      MYSQL_USER: campaign_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=TCP", "-h", "127.0.0.1", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - campaign_network

networks:
  campaign_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
